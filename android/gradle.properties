# Held at false: purchases_flutter still applies KGP unconditionally
# (~/.pub-cache/hosted/pub.dev/purchases_flutter-10.11.0/android/build.gradle:29
# "apply plugin: 'kotlin-android'") and AGP 9 rejects that under built in
# Kotlin, failing evaluation with a NullPointerException that is reported as
# "project ':purchases_flutter' does not specify compileSdk" even though it
# does. LETS ELEVATOR NEO holds the same flag at false for the same plugin.
#
# games_services 5.3.0 declares no Kotlin plugin of its own and needs one
# applied. Flutter 3.47 guards its kotlin-android auto apply behind
# isBuiltInKotlinEnabled, so turning built in Kotlin off is what puts KGP back
# on that module. The two plugins are only compatible on this side of the flag.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
