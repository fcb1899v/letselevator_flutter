pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Gradle 8.14.4 (see gradle-wrapper.properties)
plugins {
    id("com.android.application") version "9.3.0" apply false
    id("com.android.library") version "9.3.0" apply false
    // Declared but never applied to this app: AGP 9 compiles Kotlin itself.
    // Plugins still mid migration look KGP up on the classpath, and audio_session
    // fails at resolution time even though it only applies KGP when AGP < 9
    id("org.jetbrains.kotlin.android") version "2.4.10" apply false
    id("dev.flutter.flutter-plugin-loader") version "1.0.0"
    id("com.google.gms.google-services") version "4.4.4" apply false
    id("com.google.firebase.crashlytics") version "3.0.6" apply false
}

include ":app"